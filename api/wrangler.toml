# Deploy from this folder:  cd api && wrangler deploy   (see docs/DEPLOY_API_TH.md)
name = "taro-api"
main = "index.js"
compatibility_date = "2026-10-01"

# Serve the API on a subdomain of the site so the session cookie is same-site with the web page.
# Uncomment after adding the domain in Cloudflare:
# routes = [{ pattern = "api.ivoryrosetarot.online", custom_domain = true }]

[vars]
WEB_URL = "https://ivoryrosetarot.online"
API_URL = "https://api.ivoryrosetarot.online"          # used to build the OAuth redirect URI: <API_URL>/auth/<provider>/callback
ALLOWED_ORIGINS = "https://ivoryrosetarot.online,https://www.ivoryrosetarot.online"
LINE_OA_URL = "https://line.me/R/ti/p/@REPLACE_WITH_YOUR_OFFICIAL_ACCOUNT_ID"   # "add friend" link shown in account settings
EMAIL_FROM = "Ivory Rose Tarot <no-reply@ivoryrosetarot.online>"   # the domain must be verified in Resend (SPF/DKIM)
# Secrets (never in this file), set with `wrangler secret put <NAME>`:
#   RESEND_API_KEY, COOKIE_SECRET (long random string), DAILY_SECRET (long random string),
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, LINE_CHANNEL_ID, LINE_CHANNEL_SECRET, FACEBOOK_APP_ID, FACEBOOK_APP_SECRET,
#   LINE_MESSAGING_TOKEN (Messaging API channel access token), LINE_MESSAGING_SECRET (that channel's secret)
# A social login button only appears for providers whose id and secret are set.

[[d1_databases]]
binding = "DB"
database_name = "taro"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

# Register / login / password reset: 10 requests per 60 s per visitor IP (key only, never stored).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1101"
simple = { limit = 10, period = 60 }

# Daily at 03:27 Thai time (20:27 UTC): delete expired sessions, tokens, old audit rows, accounts deleted over 30 days ago.
# Hourly at :07: send due LINE reminders (must match HOURLY_CRON in lib/line.mjs).
[triggers]
crons = ["27 20 * * *", "7 * * * *"]
