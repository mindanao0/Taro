<!doctype html><html lang="th"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gothic Ivory Rose — ไพ่ 78 ใบ</title><style>body{background:#171410;color:#e3d4b7;font:16px/1.7 system-ui;margin:24px}h1{font-size:26px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:24px}figure{margin:0;border:1px solid #6b5945;padding:12px;border-radius:8px}img{width:100%;height:380px;object-fit:contain}h2{font-size:18px}p{margin:8px 0}small{color:#c9bca7}a{color:#eed9ae}@media print{body{background:white;color:black}figure{break-inside:avoid}main{grid-template-columns:repeat(3,1fr)}img{height:250px}}</style><h1>สำรับกอทิกงาช้างและกุหลาบ · 78 ใบ</h1><p>Digital Review Edition · ภาพแยกครบทุกใบ · เปิดดูในเครื่องได้ · รายละเอียดเพิ่มเติมอยู่ใน docs/</p><main>
<figure><a href="../assets/cards/major-00.png"><img loading="lazy" src="../assets/web/major-00.webp" alt="ไพ่ ผู้เริ่มเดินทาง (The Fool) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Fool<br>ผู้เริ่มเดินทาง</h2><small>major-00</small><p>ตั้งตรง: การเริ่มต้น อิสระ เปิดรับประสบการณ์</p><p>กลับหัว: ประมาท ลังเล ไม่เตรียมตัว</p><p>ก้าวเล็ก ๆ หลังตรวจความเสี่ยง</p></figcaption></figure>
<figure><a href="../assets/cards/major-01.png"><img loading="lazy" src="../assets/web/major-01.webp" alt="ไพ่ ผู้ใช้ศักยภาพ (The Magician) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Magician<br>ผู้ใช้ศักยภาพ</h2><small>major-01</small><p>ตั้งตรง: ลงมือทำ ทักษะ เปลี่ยนความคิดเป็นจริง</p><p>กลับหัว: ใช้ความสามารถผิดทาง ขาดสมาธิ</p><p>เลือกเครื่องมือที่มีแล้วเริ่มทำ</p></figcaption></figure>
<figure><a href="../assets/cards/major-02.png"><img loading="lazy" src="../assets/web/major-02.webp" alt="ไพ่ ผู้รักษาความลับ (The High Priestess) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The High Priestess<br>ผู้รักษาความลับ</h2><small>major-02</small><p>ตั้งตรง: สัญชาตญาณ ความเงียบ สิ่งที่ยังไม่เปิดเผย</p><p>กลับหัว: ละเลยเสียงภายใน ข้อมูลไม่พอ</p><p>เว้นพื้นที่ให้ข้อมูลปรากฏ</p></figcaption></figure>
<figure><a href="../assets/cards/major-03.png"><img loading="lazy" src="../assets/web/major-03.webp" alt="ไพ่ ผู้หล่อเลี้ยง (The Empress) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Empress<br>ผู้หล่อเลี้ยง</h2><small>major-03</small><p>ตั้งตรง: ความอุดมสมบูรณ์ การดูแล ความสร้างสรรค์</p><p>กลับหัว: ดูแลเกินขอบเขต ละเลยตนเอง</p><p>ดูแลร่างกายและสิ่งที่กำลังเติบโต</p></figcaption></figure>
<figure><a href="../assets/cards/major-04.png"><img loading="lazy" src="../assets/web/major-04.webp" alt="ไพ่ ผู้วางรากฐาน (The Emperor) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Emperor<br>ผู้วางรากฐาน</h2><small>major-04</small><p>ตั้งตรง: โครงสร้าง ความรับผิดชอบ ความมั่นคง</p><p>กลับหัว: ควบคุมแข็งกร้าว ไร้ระเบียบ</p><p>สร้างกติกาที่ชัดและยืดหยุ่น</p></figcaption></figure>
<figure><a href="../assets/cards/major-05.png"><img loading="lazy" src="../assets/web/major-05.webp" alt="ไพ่ ผู้ถ่ายทอด (The Hierophant) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Hierophant<br>ผู้ถ่ายทอด</h2><small>major-05</small><p>ตั้งตรง: ความเชื่อ ครู ข้อตกลง ประเพณี</p><p>กลับหัว: ตั้งคำถามต่อกรอบ ทำตามโดยไม่คิด</p><p>ถามว่ากฎใดยังช่วยคุณอยู่</p></figcaption></figure>
<figure><a href="../assets/cards/major-06.png"><img loading="lazy" src="../assets/web/major-06.webp" alt="ไพ่ ผู้เลือกผูกพัน (The Lovers) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Lovers<br>ผู้เลือกผูกพัน</h2><small>major-06</small><p>ตั้งตรง: ความรัก ความสอดคล้อง การเลือกด้วยคุณค่า</p><p>กลับหัว: ค่านิยมขัดกัน เลี่ยงการเลือก</p><p>ตรวจว่าการเลือกตรงกับคุณค่าของตนไหม</p></figcaption></figure>
<figure><a href="../assets/cards/major-07.png"><img loading="lazy" src="../assets/web/major-07.webp" alt="ไพ่ ผู้กำหนดทิศ (The Chariot) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Chariot<br>ผู้กำหนดทิศ</h2><small>major-07</small><p>ตั้งตรง: มุ่งมั่น กำกับแรงที่ขัดกัน เดินหน้า</p><p>กลับหัว: เสียการควบคุม ฝืนไปคนละทาง</p><p>กำหนดทิศและจัดแรงให้ไปด้วยกัน</p></figcaption></figure>
<figure><a href="../assets/cards/major-08.png"><img loading="lazy" src="../assets/web/major-08.webp" alt="ไพ่ พลังอ่อนโยน (Strength) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Strength<br>พลังอ่อนโยน</h2><small>major-08</small><p>ตั้งตรง: ความกล้า ความอดทน กำกับอารมณ์</p><p>กลับหัว: ไม่มั่นใจ กดอารมณ์ ใช้อำนาจ</p><p>ตอบสนองอย่างมีสติแทนการบังคับ</p></figcaption></figure>
<figure><a href="../assets/cards/major-09.png"><img loading="lazy" src="../assets/web/major-09.webp" alt="ไพ่ ผู้ค้นภายใน (The Hermit) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Hermit<br>ผู้ค้นภายใน</h2><small>major-09</small><p>ตั้งตรง: ทบทวนตัวเอง ปัญญา เว้นระยะ</p><p>กลับหัว: โดดเดี่ยวเกินไป ปิดกั้นคำแนะนำ</p><p>หาความเงียบที่ช่วยให้เห็นทาง</p></figcaption></figure>
<figure><a href="../assets/cards/major-10.png"><img loading="lazy" src="../assets/web/major-10.webp" alt="ไพ่ วงล้อแห่งการเปลี่ยน (Wheel of Fortune) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Wheel of Fortune<br>วงล้อแห่งการเปลี่ยน</h2><small>major-10</small><p>ตั้งตรง: วัฏจักร จังหวะเปลี่ยน สิ่งนอกการควบคุม</p><p>กลับหัว: ติดวงจรเดิม ต้านความเปลี่ยนแปลง</p><p>แยกสิ่งที่ควบคุมได้ออกจากจังหวะภายนอก</p></figcaption></figure>
<figure><a href="../assets/cards/major-11.png"><img loading="lazy" src="../assets/web/major-11.webp" alt="ไพ่ ดุลยธรรม (Justice) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Justice<br>ดุลยธรรม</h2><small>major-11</small><p>ตั้งตรง: ความเป็นธรรม ข้อเท็จจริง ผลของการกระทำ</p><p>กลับหัว: อคติ เลี่ยงความรับผิดชอบ</p><p>ตัดสินจากหลักฐานและรับผิดชอบส่วนของตน</p></figcaption></figure>
<figure><a href="../assets/cards/major-12.png"><img loading="lazy" src="../assets/web/major-12.webp" alt="ไพ่ ผู้เปลี่ยนมุมมอง (The Hanged Man) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Hanged Man<br>ผู้เปลี่ยนมุมมอง</h2><small>major-12</small><p>ตั้งตรง: หยุดเพื่อเห็นใหม่ ปล่อยการควบคุม</p><p>กลับหัว: ค้างคา เสียสละจนลืมตน</p><p>เปลี่ยนมุมก่อนเพิ่มแรง</p></figcaption></figure>
<figure><a href="../assets/cards/major-13.png"><img loading="lazy" src="../assets/web/major-13.webp" alt="ไพ่ การสิ้นสุดและเปลี่ยนผ่าน (Death) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Death<br>การสิ้นสุดและเปลี่ยนผ่าน</h2><small>major-13</small><p>ตั้งตรง: จบวงจร ปล่อยของเก่า เปลี่ยนผ่าน</p><p>กลับหัว: ยื้อสิ่งที่จบ กลัวการเปลี่ยน</p><p>ระบุสิ่งที่ควรปล่อยเพื่อเริ่มระยะใหม่</p></figcaption></figure>
<figure><a href="../assets/cards/major-14.png"><img loading="lazy" src="../assets/web/major-14.webp" alt="ไพ่ ผู้ประสานสมดุล (Temperance) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Temperance<br>ผู้ประสานสมดุล</h2><small>major-14</small><p>ตั้งตรง: พอดี ปรับจังหวะ ประสานความต่าง</p><p>กลับหัว: สุดโต่ง ไม่ลงตัว เร่งเกินไป</p><p>ทดลองปรับทีละน้อยแทนสุดขั้ว</p></figcaption></figure>
<figure><a href="../assets/cards/major-15.png"><img loading="lazy" src="../assets/web/major-15.webp" alt="ไพ่ พันธนาการ (The Devil) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Devil<br>พันธนาการ</h2><small>major-15</small><p>ตั้งตรง: ยึดติด ความอยาก อำนาจที่ผูกมัด</p><p>กลับหัว: เริ่มเห็นพันธะ ปลดการควบคุม</p><p>มองว่าพันธะใดคลายออกได้</p></figcaption></figure>
<figure><a href="../assets/cards/major-16.png"><img loading="lazy" src="../assets/web/major-16.webp" alt="ไพ่ หอคอยแตกสลาย (The Tower) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Tower<br>หอคอยแตกสลาย</h2><small>major-16</small><p>ตั้งตรง: ความจริงฉับพลัน โครงสร้างเดิมสั่นคลอน</p><p>กลับหัว: กลัวความจริง ยื้อการเปลี่ยน</p><p>รับมือสิ่งตรงหน้าแล้วสร้างฐานใหม่</p></figcaption></figure>
<figure><a href="../assets/cards/major-17.png"><img loading="lazy" src="../assets/web/major-17.webp" alt="ไพ่ แสงแห่งความหวัง (The Star) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Star<br>แสงแห่งความหวัง</h2><small>major-17</small><p>ตั้งตรง: ฟื้นตัว ความหวัง ความไว้วางใจ</p><p>กลับหัว: หมดแรง ไม่เห็นคุณค่าในความหวัง</p><p>เลือกการดูแลเล็ก ๆ ที่ทำได้วันนี้</p></figcaption></figure>
<figure><a href="../assets/cards/major-18.png"><img loading="lazy" src="../assets/web/major-18.webp" alt="ไพ่ ดวงจันทร์ (The Moon) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Moon<br>ดวงจันทร์</h2><small>major-18</small><p>ตั้งตรง: ความคลุมเครือ ความฝัน ความกลัว</p><p>กลับหัว: ค่อยเห็นความจริง สับสนภายใน</p><p>แยกสิ่งที่รู้จริงจากสิ่งที่กังวล</p></figcaption></figure>
<figure><a href="../assets/cards/major-19.png"><img loading="lazy" src="../assets/web/major-19.webp" alt="ไพ่ แสงแห่งความชัด (The Sun) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The Sun<br>แสงแห่งความชัด</h2><small>major-19</small><p>ตั้งตรง: ความสุข ความชัดเจน พลังชีวิต</p><p>กลับหัว: ความสุขถูกบดบัง คาดหวังเกินจริง</p><p>ทำสิ่งที่สร้างความมีชีวิตชีวา</p></figcaption></figure>
<figure><a href="../assets/cards/major-20.png"><img loading="lazy" src="../assets/web/major-20.webp" alt="ไพ่ เสียงเรียกให้ตื่น (Judgement) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Judgement<br>เสียงเรียกให้ตื่น</h2><small>major-20</small><p>ตั้งตรง: ทบทวนอดีต ตื่นรู้ เลือกใหม่</p><p>กลับหัว: ตำหนิตน ไม่ฟังสิ่งที่ต้องเปลี่ยน</p><p>ใช้บทเรียนโดยไม่ลงโทษตนซ้ำ</p></figcaption></figure>
<figure><a href="../assets/cards/major-21.png"><img loading="lazy" src="../assets/web/major-21.webp" alt="ไพ่ ความครบถ้วน (The World) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>The World<br>ความครบถ้วน</h2><small>major-21</small><p>ตั้งตรง: สำเร็จ บูรณาการ จบวงจร</p><p>กลับหัว: งานค้าง ขาดการปิดบท</p><p>ปิดงานที่ค้างแล้วฉลองอย่างพอดี</p></figcaption></figure>
<figure><a href="../assets/cards/wands-ace.png"><img loading="lazy" src="../assets/web/wands-ace.webp" alt="ไพ่ หนึ่งไม้เท้า (Ace of Wands) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Ace of Wands<br>หนึ่งไม้เท้า</h2><small>wands-ace</small><p>ตั้งตรง: ประกายเริ่มต้น แรงบันดาลใจ</p><p>กลับหัว: ไฟมอด เริ่มไม่ออก</p><p>ลงมือทดลองหนึ่งอย่าง</p></figcaption></figure>
<figure><a href="../assets/cards/wands-two.png"><img loading="lazy" src="../assets/web/wands-two.webp" alt="ไพ่ สองไม้เท้า (Two of Wands) ลายเส้นภาพพิมพ์กอทิก หมึกดำบนกระดาษงาช้างแต้มแดงหม่น"></a><figcaption><h2>Two of Wands<br>สองไม้เท้า</h2><small>wands-two</small><p>ตั้งตรง: วางแผน มองทางเลือก</p><p>กลับหัว: ลังเล กลัวออกจากพื้นที่เดิม</p><p>เปรียบเทียบทางเลือกกับเป้าหมาย</p></figcaption></figure>
