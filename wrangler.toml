name = "taro-log"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "taro-log"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"
migrations_dir = "migrations"

# Rate limit: 5 posts / 60 s per visitor IP (key only, never stored). Needs wrangler >= 4.36.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Click-sequence batches: 30 posts / 60 s per visitor IP.
[[ratelimits]]
name = "EVENTS_LIMITER"
namespace_id = "1002"
simple = { limit = 30, period = 60 }

# Daily at 03:17 Thai time (20:17 UTC): roll up and purge old click events and questions.
[triggers]
crons = ["17 20 * * *"]
