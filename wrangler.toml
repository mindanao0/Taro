name = "taro-log"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "taro-log"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Rate limit: 5 posts / 60 s per visitor IP (key only, never stored). Needs wrangler >= 4.36.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
