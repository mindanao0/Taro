name: tests
on:
  push:
  pull_request:

jobs:
  fast:
    name: fast tests and Worker bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: npm ci
      - run: npm test
      # the real Workers runtime (workerd) with a local D1: proves the bundle starts and that WebCrypto/D1 accept what we send
      - run: npm run test:workerd
      # bundling catches broken imports and bad wrangler.toml without needing any Cloudflare credentials
      - name: taro-api bundles
        run: cd api && npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/api-out"
      - name: taro-log bundles
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/log-out"

  browser:
    name: browser tests (phone and desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
